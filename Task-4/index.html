<!DOCTYPE html>
<html>

<head>

</head>

        </div>

    <main>

        <div class="form">

            <div class="formButtons">

        <div class="result" id="counters"></div>

    <footer>
        <p>Знаешь море? Я его волную.</p>
        <p>© Джейсон Стетхем</p>
    </footer>

    <script src="script.js"></script>

</html>
