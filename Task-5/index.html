<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="siteHeader">
        <div class="siteHeaderInner">
            <span class="siteTitle">Лос Полос Херманос</span>
        </div>

    <main>
        <h2 class="sectionTitle">Проверка пароля</h2>

        <div class="form">

                <label class="formLabel" for="password">Пароль</label>

            <div class="formButtons">
                <button class="buttonPrimary" id="checkBtn">Проверить</button>
            </div>
        </div>

        <div class="result" id="result"></div>
    </main>

    <footer>
        <p>Знаешь море? Я его волную.</p>
        <p>© Джейсон Стетхем</p>
    </footer>

    <script src="script.js"></script>

</html>
