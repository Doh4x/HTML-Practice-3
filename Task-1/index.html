<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="siteHeader">
        <div class="siteHeaderInner">
            <span class="siteTitle">Лос Полос Херманос</span>
        </div>
    </header>

    <main>
        <h2 class="sectionTitle">Калькулятор</h2>

        <div class="form">
            <div class="formGroup">
                <label class="formLabel" for="a">Первое число</label>
                <input class="formInput" type="number" id="a" placeholder="10">
            </div>

            <div class="formGroup">
                <label class="formLabel" for="op">Операция</label>
                <select class="formSelect" id="op">
                    <option value="+">Сложение (+)</option>
                    <option value="-">Вычитание (-)</option>
                    <option value="*">Умножение (×)</option>
                    <option value="/">Деление (÷)</option>
                </select>
            </div>

            <div class="formGroup">
                <label class="formLabel" for="b">Второе число</label>
                <input class="formInput" type="number" id="b" placeholder="2">
            </div>

            <div class="formButtons">
                <button class="buttonPrimary" id="calcBtn">Посчитать</button>
            </div>
        </div>

        <div class="result" id="result"></div>
    </main>

    <footer>
        <p>Знаешь море? Я его волную.</p>
        <p>© Джейсон Стетхем</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
